name: Test & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test image (self-signed TLS)
        run: |
          docker build -t arrmor:test .
          docker volume create arrmor-certs
          docker run -d --name arrmor-test -p 8443:8080 \
            -v arrmor-certs:/certs \
            -e ARRMOR_TLS_SELF_SIGNED=true -e ARRMOR_TLS_SAN=IP:127.0.0.1 \
            -e ARRMOR_RADARR_URL=http://127.0.0.1:1 -e ARRMOR_RADARR_API_KEY=x \
            -e ARRMOR_RADARR_PROXY_KEY=$(openssl rand -hex 32) \
            arrmor:test
          sleep 3
          docker logs arrmor-test
          docker cp arrmor-test:/certs/arrmor.crt arrmor.crt
          curl --fail --silent --show-error --cacert arrmor.crt https://127.0.0.1:8443/healthz
          docker exec arrmor-test python /app/arrmor.py --healthcheck
          # restart keeps the certificate
          docker restart arrmor-test && sleep 3
          docker cp arrmor-test:/certs/arrmor.crt arrmor2.crt
          cmp arrmor.crt arrmor2.crt
          curl --fail --silent --show-error --cacert arrmor.crt https://127.0.0.1:8443/healthz
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/arrmor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
